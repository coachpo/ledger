  workflows:
  - key: advisory_research
    name: Advisory Research
    description: Canonical TradingAgents advisory research topology using SignalDeck
      sequence and bounded loop semantics only.
    inputSchema:
      type: object
      title: TradingAgents advisory research inputs
      required:
      - ticker
      - asOfDate
      - horizonDays
      - benchmarkSymbol
      properties:
        ticker:
          type: string
          title: Ticker symbol
          description: Required equity or asset symbol to research, such as AAPL.
        asOfDate:
          type: string
          title: As-of date
          description: Required research date in YYYY-MM-DD format for point-in-time
            context.
        horizonDays:
          type: integer
          title: Horizon in days
          default: 30
          description: Required advisory horizon, in calendar days, for the research and
            risk framing.
        portfolioId:
          type: string
          title: Portfolio ID
          default: ""
          description: Optional SignalDeck portfolio identifier used to include current
            positions when available. Leave blank for standalone research.
        outputLanguage:
          type: string
          title: Output language
          default: English
          description: Optional language for generated advisory reports.
        benchmarkSymbol:
          type: string
          title: Benchmark symbol
          default: SPY
          description: Required benchmark symbol used for relative market and risk
            context.
        maxRiskDebateRounds:
          type: integer
          title: Risk debate rounds
          default: 2
          description: Optional cap retained for operator context; the package workflow
            uses the static bounded loop cap required by the manifest format.
        maxInvestmentDebateRounds:
          type: integer
          title: Investment debate rounds
          default: 2
          description: Optional cap retained for operator context; the package workflow
            uses the static bounded loop cap required by the manifest format.
      description: Operator inputs for a neutral advisory research run. Defaults are
        safe placeholders and do not contain credentials or provider configuration.
    flow:
      kind: sequence
      id: root_sequence
      nodes:
      - kind: sequence
        id: macro_context_sequence
        nodes:
        - kind: step
          id: macro_context_collection
          slot: macro_context
          uses: macro_context_collector
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
          optional: false
        - kind: step
          id: news_breadth_collection
          slot: news_breadth
          uses: news_breadth_collector
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
            macroContext: ${{ nodes.macro_context_collection.outputs.macro_context }}
          optional: false
      - kind: step
        id: prediction_market_collection
        slot: prediction_market_context
        uses: prediction_market_analyst
        with:
          ticker: ${{ inputs.ticker }}
          asOfDate: ${{ inputs.asOfDate }}
          horizonDays: ${{ inputs.horizonDays }}
          outputLanguage: ${{ inputs.outputLanguage }}
          macroContext: ${{ nodes.macro_context_sequence.outputs.macro_context }}
          newsBreadth: ${{ nodes.macro_context_sequence.outputs.news_breadth }}
        optional: false
      - kind: sequence
        id: analyst_research
        nodes:
        - kind: step
          id: market_analysis
          slot: market_report
          uses: market_analyst
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
            benchmarkSymbol: ${{ inputs.benchmarkSymbol }}
          optional: false
        - kind: step
          id: sentiment_analysis
          slot: sentiment_report
          uses: sentiment_analyst
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
            newsBreadth: ${{ nodes.macro_context_sequence.outputs.news_breadth }}
          optional: false
        - kind: step
          id: news_analysis
          slot: news_report
          uses: news_analyst
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
            macroContext: ${{ nodes.macro_context_sequence.outputs.macro_context }}
            newsBreadth: ${{ nodes.macro_context_sequence.outputs.news_breadth }}
          optional: false
        - kind: step
          id: fundamentals_analysis
          slot: fundamentals_report
          uses: fundamentals_analyst
          with:
            ticker: ${{ inputs.ticker }}
            asOfDate: ${{ inputs.asOfDate }}
            horizonDays: ${{ inputs.horizonDays }}
            outputLanguage: ${{ inputs.outputLanguage }}
          optional: false
      - kind: loop
        id: investment_debate
        maxIterations: 2
        sequence:
          kind: sequence
          id: investment_debate_round
          nodes:
          - kind: step
            id: bull_research
            slot: bull_case
            uses: bull_researcher
            with:
              newsReport: ${{ nodes.analyst_research.outputs.news_report }}
              marketReport: ${{ nodes.analyst_research.outputs.market_report }}
              outputLanguage: ${{ inputs.outputLanguage }}
              sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
              fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report
                }}
            optional: false
          - kind: step
            id: bear_research
            slot: investment_debate_state
            uses: bear_researcher
            with:
              newsReport: ${{ nodes.analyst_research.outputs.news_report }}
              priorState: ${{ nodes.bull_research.outputs.bull_case }}
              marketReport: ${{ nodes.analyst_research.outputs.market_report }}
              outputLanguage: ${{ inputs.outputLanguage }}
              sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
              fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report
                }}
            optional: false
        state: {}
      - kind: step
        id: research_management
        slot: research_plan
        uses: research_manager
        with:
          ticker: ${{ inputs.ticker }}
          newsReport: ${{ nodes.analyst_research.outputs.news_report }}
          debateState: ${{ nodes.investment_debate.outputs.investment_debate_state }}
          horizonDays: ${{ inputs.horizonDays }}
          marketReport: ${{ nodes.analyst_research.outputs.market_report }}
          outputLanguage: ${{ inputs.outputLanguage }}
          macroContext: ${{ nodes.macro_context_sequence.outputs.macro_context }}
          newsBreadth: ${{ nodes.macro_context_sequence.outputs.news_breadth }}
          predictionMarketContext: ${{
            nodes.prediction_market_collection.outputs.prediction_market_context }}
          sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
          fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report }}
        optional: false
      - kind: step
        id: trader_advisory
        slot: trader_proposal
        uses: trader
        with:
          ticker: ${{ inputs.ticker }}
          horizonDays: ${{ inputs.horizonDays }}
          portfolioId: ${{ inputs.portfolioId }}
          researchPlan: ${{ nodes.research_management.outputs.research_plan }}
          outputLanguage: ${{ inputs.outputLanguage }}
          predictionMarketContext: ${{
            nodes.prediction_market_collection.outputs.prediction_market_context }}
        optional: false
      - kind: loop
        id: risk_debate
        maxIterations: 2
        sequence:
          kind: sequence
          id: risk_debate_round
          nodes:
          - kind: step
            id: aggressive_risk_review
            slot: aggressive_risk_case
            uses: aggressive_risk_analyst
            with:
              newsReport: ${{ nodes.analyst_research.outputs.news_report }}
              marketReport: ${{ nodes.analyst_research.outputs.market_report }}
              researchPlan: ${{ nodes.research_management.outputs.research_plan }}
              outputLanguage: ${{ inputs.outputLanguage }}
              predictionMarketContext: ${{
                nodes.prediction_market_collection.outputs.prediction_market_context }}
              traderProposal: ${{ nodes.trader_advisory.outputs.trader_proposal }}
              sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
              fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report
                }}
            optional: false
          - kind: step
            id: neutral_risk_review
            slot: neutral_risk_case
            uses: neutral_risk_analyst
            with:
              newsReport: ${{ nodes.analyst_research.outputs.news_report }}
              priorState: ${{ nodes.aggressive_risk_review.outputs.aggressive_risk_case
                }}
              marketReport: ${{ nodes.analyst_research.outputs.market_report }}
              researchPlan: ${{ nodes.research_management.outputs.research_plan }}
              outputLanguage: ${{ inputs.outputLanguage }}
              predictionMarketContext: ${{
                nodes.prediction_market_collection.outputs.prediction_market_context }}
              traderProposal: ${{ nodes.trader_advisory.outputs.trader_proposal }}
              sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
              fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report
                }}
            optional: false
          - kind: step
            id: conservative_risk_review
            slot: risk_debate_state
            uses: conservative_risk_analyst
            with:
              newsReport: ${{ nodes.analyst_research.outputs.news_report }}
              priorState: ${{ nodes.neutral_risk_review.outputs.neutral_risk_case }}
              marketReport: ${{ nodes.analyst_research.outputs.market_report }}
              researchPlan: ${{ nodes.research_management.outputs.research_plan }}
              outputLanguage: ${{ inputs.outputLanguage }}
              predictionMarketContext: ${{
                nodes.prediction_market_collection.outputs.prediction_market_context }}
              traderProposal: ${{ nodes.trader_advisory.outputs.trader_proposal }}
              sentimentReport: ${{ nodes.analyst_research.outputs.sentiment_report }}
              fundamentalsReport: ${{ nodes.analyst_research.outputs.fundamentals_report
                }}
            optional: false
        state: {}
      - kind: step
        id: portfolio_management
        slot: portfolio_decision
        uses: portfolio_manager
        with:
          ticker: ${{ inputs.ticker }}
          riskState: ${{ nodes.risk_debate.outputs.risk_debate_state }}
          horizonDays: ${{ inputs.horizonDays }}
          portfolioId: ${{ inputs.portfolioId }}
