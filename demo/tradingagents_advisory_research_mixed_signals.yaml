apiVersion: signaldeck.workflowPackage/v1
kind: WorkflowPackage
metadata:
  key: tradingagents_advisory_research_mixed_signals
  name: TradingAgents Advisory Research Mixed Signals
  description: Mixed-extension TradingAgents advisory research with native Digital
    Oracle macro/rates and prediction-market evidence plus Finance research tools
    through package semantics.
spec:
  inputs:
    type: object
    title: TradingAgents advisory research inputs
    required:
    - ticker
    - asOfDate
    - horizonDays
    - benchmarkSymbol
    properties:
      ticker:
        type: string
        title: Ticker symbol
        description: Required equity or asset symbol to research, such as AAPL.
      asOfDate:
        type: string
        title: As-of date
        description: Required research date in YYYY-MM-DD format for point-in-time
          context.
      horizonDays:
        type: integer
        title: Horizon in days
        default: 30
        description: Required advisory horizon, in calendar days, for the research and
          risk framing.
      portfolioId:
        type: string
        title: Portfolio ID
        default: ""
        description: Optional SignalDeck portfolio identifier used to include current
          positions when available. Leave blank for standalone research.
      outputLanguage:
        type: string
        title: Output language
        default: English
        description: Optional language for generated advisory reports.
      benchmarkSymbol:
        type: string
        title: Benchmark symbol
        default: SPY
        description: Required benchmark symbol used for relative market and risk
          context.
      maxRiskDebateRounds:
        type: integer
        title: Risk debate rounds
        default: 2
        description: Optional cap for risk debate iterations; defaults to a short,
          operator-friendly review.
      maxInvestmentDebateRounds:
        type: integer
        title: Investment debate rounds
        default: 2
        description: Optional cap for investment debate iterations; defaults to a short,
          operator-friendly review.
    description: Operator inputs for a neutral advisory research run. Defaults are safe
      placeholders and do not contain credentials or provider configuration.
  capabilityProfiles:
  - key: market_research_tools
    name: Market Research Tools
    description: Reads market prices, history, OHLCV, and indicators from SignalDeck
      native tools.
    toolKeys:
    - signaldeck.finance.indicators.lookup
    - signaldeck.finance.market_data.history_lookup
    - signaldeck.finance.market_data.ohlcv_lookup
    - signaldeck.finance.market_data.quote_lookup
  - key: fundamentals_tools
    name: Fundamentals Tools
    description: Reads fundamentals data exposed by the SignalDeck server catalog.
    toolKeys:
    - signaldeck.finance.fundamentals.lookup
  - key: news_research_tools
    name: News Research Tools
    description: Reads Finance-owned company news and insider-data context from
      SignalDeck native tools.
    toolKeys:
    - signaldeck.finance.insider_data.lookup
    - signaldeck.finance.news.lookup
  - key: social_sentiment_tools
    name: Social Sentiment Tools
    description: Reads normalized social sentiment source blocks from SignalDeck native
      tools.
    toolKeys:
    - signaldeck.finance.social_sentiment.lookup
  - key: report_context_tools
    name: Report Context Tools
    description: Reads persisted SignalDeck reports for advisory research context.
    toolKeys:
    - signaldeck.finance.reports.lookup
  - key: portfolio_context_tools
    name: Portfolio Context Tools
    description: Reads persisted SignalDeck positions for portfolio context.
    toolKeys:
    - signaldeck.finance.positions.lookup
  - key: prediction_market_tools
    name: Prediction Market Tools
    description: Reads Digital Oracle prediction-market evidence only for mixed-signal
      advisory context.
    toolKeys:
    - signaldeck.digital_oracle.prediction_markets.lookup
  - key: macro_rates_tools
    name: Macro Rates Tools
    description: Reads Digital Oracle macro/rates evidence for mixed-signal advisory
      context.
    toolKeys:
    - signaldeck.digital_oracle.macro_rates.lookup
  outputSchemas:
  - key: analyst_report
    name: Analyst Report
    description: Structured analyst research note.
    jsonSchema:
      type: object
      required:
      - summary
      - evidence
      - limitations
      properties:
        summary:
          type: string
        evidence:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
  - key: macro_context_packet
    name: Macro Context Packet
    description: Bounded macro and rates evidence packet with provenance.
    jsonSchema:
      type: object
      required:
      - summary
      - findings
      - limitations
      - warnings
      - sourceType
      - sourceUrl
      - fetchedAt
      - query
      - stableSourceId
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        sourceType:
          type: string
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        query:
          type: string
        stableSourceId:
          type: string
  - key: web_news_breadth_packet
    name: Web News Breadth Packet
    description: Bounded public web/news breadth packet with provenance and explicit
      limitations.
    jsonSchema:
      type: object
      required:
      - summary
      - findings
      - limitations
      - warnings
      - sourceType
      - sourceUrl
      - fetchedAt
      - query
      - stableSourceId
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        sourceType:
          type: string
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        query:
          type: string
        stableSourceId:
          type: string
  - key: prediction_market_packet
    name: Prediction Market Packet
    description: Bounded prediction-market evidence packet with provenance, uncertainty,
      and explicit limitations.
    jsonSchema:
      type: object
      required:
      - summary
      - findings
      - limitations
      - warnings
      - sourceType
      - sourceUrl
      - fetchedAt
      - query
      - stableSourceId
      properties:
        summary:
          type: string
        findings:
          type: array
          items:
            type: string
        limitations:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        sourceType:
          type: string
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        query:
          type: string
        stableSourceId:
          type: string
  - key: investment_debate_transition
    name: Investment Debate Transition
    description: Complete investment debate state transition.
    jsonSchema:
      type: object
      required:
      - nextState
      properties:
        nextState:
          type: object
          required:
          - latestSpeaker
          - summary
          - supportingPoints
          - opposingPoints
          - openQuestions
          properties:
            summary:
              type: string
            latestSpeaker:
              type: string
            openQuestions:
              type: array
              items:
                type: string
            opposingPoints:
              type: array
              items:
                type: string
            supportingPoints:
              type: array
              items:
                type: string
  - key: research_plan
    name: Research Plan
    description: Research manager advisory plan.
    jsonSchema:
      type: object
      required:
      - thesis
      - debateSummary
      - recommendation
      properties:
        thesis:
          type: string
        debateSummary:
          type: string
        recommendation:
          type: string
  - key: trader_proposal
    name: Trader Proposal
    description: Advisory portfolio exposure proposal.
    jsonSchema:
      type: object
      required:
      - posture
      - rationale
      - sizingNotes
      properties:
        posture:
          type: string
        rationale:
          type: string
        sizingNotes:
          type: string
  - key: risk_debate_transition
    name: Risk Debate Transition
    description: Complete risk debate state transition.
    jsonSchema:
      type: object
      required:
      - nextState
      properties:
        nextState:
          type: object
          required:
          - latestSpeaker
          - summary
          - supportingPoints
          - opposingPoints
          - openQuestions
          properties:
            summary:
              type: string
            latestSpeaker:
              type: string
            openQuestions:
              type: array
              items:
                type: string
            opposingPoints:
              type: array
              items:
                type: string
            supportingPoints:
              type: array
              items:
                type: string
  - key: portfolio_decision
    name: Portfolio Decision
    description: Final advisory portfolio decision.
    jsonSchema:
      type: object
      required:
      - posture
      - rationale
      - riskSummary
      - implementationNotes
      properties:
        posture:
          type: string
        rationale:
          type: string
        riskSummary:
          type: string
        implementationNotes:
          type: string
  mcpServers:
  - key: web_research
    name: Web Research
    description: Package-private web evidence search for bounded advisory context.
    transport: http-sse
    url: https://mcp.exa.ai/mcp
    headers:
      Authorization: Bearer IMPLEMENTATION_TIME_VALUE
    query:
      api_key: IMPLEMENTATION_TIME_VALUE
    toolKeys:
    - web_search_exa
  agents:
  - key: macro_context_collector
    name: Macro Context Collector
    description: Uses native Digital Oracle macro/rates evidence to produce bounded
      macro context.
    modelConnection: tradingagents_primary_model
    systemPrompt: |
      You collect native Digital Oracle macro and rates evidence for a mixed-extension TradingAgents advisory run. Use only the granted macro/rates lookup tool and the provided ticker, asOfDate, horizonDays, and outputLanguage inputs.

      Request bounded macro_indicators, yield_curve, policy_rates, fx_rates, credit_gaps, and fedwatch context only when relevant to the requested horizon. Include provenance, warnings, and limitations for stale, missing, partial, or unavailable native tool coverage. Do not fabricate observations, rates, revisions, or economic conclusions unsupported by returned tool evidence.

      Return only the bounded macro_context_packet schema.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
    outputSchema: macro_context_packet
    capabilityProfiles:
    - macro_rates_tools
    mcpServers: []
  - key: news_breadth_collector
    name: News Breadth Collector
    description: Uses package-private web research to summarize public news and
      sentiment breadth as bounded evidence.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You collect supplementary public web/news breadth for a mixed-signals TradingAgents advisory run. Use the package-private web_research MCP only for broad public news/page evidence related to ticker, asOfDate, horizonDays, and macro context.

      Summarize findings as bounded evidence statements with provenance, warnings, limitations, source fields, and explicit uncertainty. Do not fabricate articles, posts, usernames, engagement counts, social metrics, provider scores, or community narratives. Treat web-derived breadth as supplementary context, not authoritative SignalDeck social sentiment telemetry.

      Return only the bounded web_news_breadth_packet schema.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
        macroContext:
          type: object
          required: []
          properties: {}
    outputSchema: web_news_breadth_packet
    capabilityProfiles: []
    mcpServers:
    - web_research
  - key: prediction_market_analyst
    name: Prediction Market Analyst
    description: Normalizes Digital Oracle prediction-market evidence into bounded
      advisory context for mixed-signal research.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You collect prediction-market evidence for the mixed-signals TradingAgents advisory run. Use only the granted Digital Oracle prediction-market tool and the provided run inputs; do not use SEC filings, market sentiment, or package-private web research.

      Normalize any available market probabilities, event definitions, horizons, liquidity caveats, and disagreements into bounded evidence statements. Treat prediction markets as supplementary public expectations, not authoritative price, sentiment, or filing evidence. Do not fabricate contracts, probabilities, odds, volumes, source URLs, or event outcomes when the tool does not provide them.

      Return only the bounded prediction_market_packet schema.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
        macroContext:
          type: object
          required: []
          properties: {}
        newsBreadth:
          type: object
          required: []
          properties: {}
    outputSchema: prediction_market_packet
    capabilityProfiles:
    - prediction_market_tools
    mcpServers: []
  - key: market_analyst
    name: Market Analyst
    description: Tool-first market technician for TradingAgents-style advisory research.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents market analyst translated into SignalDeck package semantics. Use only the granted SignalDeck market research tools and the provided run inputs for ticker, asOfDate, horizonDays, benchmarkSymbol, and outputLanguage.

      Gather quote, historical price, OHLCV, and indicator evidence before writing conclusions. Select no more than eight indicators, request them by exact supported indicator names when a tool requires names, and explain why each selected signal matters for the requested horizon. Do not invent prices, indicators, liquidity, or benchmark behavior; if a tool returns warnings, stale data, or empty payloads, disclose that limitation.

      Produce a concise market report in the requested language. Emphasize trend, momentum, volatility, volume, support/resistance, and benchmark-relative context. End with a Markdown table summarizing each tool-backed signal, its reading, and its implication. This is research only, not a recommendation to trade.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
        benchmarkSymbol:
          type: string
    outputSchema: analyst_report
    capabilityProfiles:
    - market_research_tools
    mcpServers: []
  - key: sentiment_analyst
    name: Sentiment Analyst
    description: Single-shot sentiment synthesizer using SignalDeck social sentiment
      payloads.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the canonical TradingAgents sentiment analyst, replacing the deprecated social-media analyst role. In SignalDeck, treat social sentiment as pre-normalized source blocks from the granted social sentiment tool and any provided prefetched sentiment context.

      Perform a single-shot synthesis rather than fabricating posts, usernames, engagement counts, or community narratives. Use the granted social sentiment capability only for the requested ticker/date context, and treat provided newsBreadth as supplementary public context rather than social telemetry. Explain directional sentiment, intensity, notable disagreements, and coverage gaps. If source coverage is stale, sparse, unavailable, or warning-bearing, say so plainly.

      Produce an advisory sentiment report in the requested outputLanguage. Keep the report evidence-based and research-only; do not recommend order placement, execution timing, or trade-operation drafting.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
        prefetchedSentiment:
          type: object
          required: []
          properties: {}
        newsBreadth:
          type: object
          required: []
          properties: {}
    outputSchema: analyst_report
    capabilityProfiles:
    - social_sentiment_tools
    mcpServers: []
  - key: news_analyst
    name: News Analyst
    description: Tool-first news and insider-data analyst for the advisory research
      packet.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents news analyst translated into SignalDeck package semantics. Use only the granted SignalDeck news research tools for company news and insider-data context around ticker and asOfDate.

      Ground every catalyst, event, insider signal, and macro or sector reference in returned tool evidence, provided macroContext, provided newsBreadth, or run inputs. Treat macroContext and newsBreadth as supplementary bounded evidence, not as direct SignalDeck tool output. Do not invent articles, headlines, dates, filings, sources, insider activity, social metrics, or event probabilities. Disclose missing provider coverage, stale data, empty payloads, and tool warnings as data-quality limitations.

      Produce a concise news report in outputLanguage that separates confirmed catalysts, possible second-order effects, and uncertainties for the requested horizon. Keep the framing advisory and research-only.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
        macroContext:
          type: object
          required: []
          properties: {}
        newsBreadth:
          type: object
          required: []
          properties: {}
    outputSchema: analyst_report
    capabilityProfiles:
    - news_research_tools
    mcpServers: []
  - key: fundamentals_analyst
    name: Fundamentals Analyst
    description: Tool-first fundamentals analyst for valuation, quality, and financial
      context.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents fundamentals analyst translated into SignalDeck package semantics. Use only the granted SignalDeck fundamentals tool and provided run inputs; never invent financial statements, ratios, filing facts, margins, growth rates, or valuation multiples.

      Analyze the returned fundamentals for quality, growth, profitability, leverage, valuation, and horizon-relevant risks. When data is incomplete, stale, warning-bearing, or absent, disclose the limitation and avoid overconfidence.

      Produce a concise fundamentals report in outputLanguage with evidence-backed positives, negatives, and watch items. Keep the framing advisory and research-only.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        asOfDate:
          type: string
        horizonDays:
          type: integer
        outputLanguage:
          type: string
    outputSchema: analyst_report
    capabilityProfiles:
    - fundamentals_tools
    mcpServers: []
  - key: bull_researcher
    name: Bull Researcher
    description: Bullish investment-debate advocate using analyst reports, not direct
      tools.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents bull researcher in a bounded investment debate. Use the provided market, sentiment, news, and fundamentals reports plus prior debate state; you do not have direct tools.

      Build the strongest evidence-based bullish case for the ticker over the requested horizon. Address upside catalysts, supportive technical or fundamental evidence, sentiment/news tailwinds, and why bearish objections may be overstated. Do not fabricate new evidence beyond the supplied reports.

      Return a debate-stage response in outputLanguage that can update bullCase and debateHistory. Keep the posture analytical and advisory-only; do not issue execution instructions.
    inputSchema:
      type: object
      required: []
      properties:
        newsReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        priorState:
          type: object
          required: []
          properties:
            nextState:
              type: object
              required:
              - latestSpeaker
              - summary
              - supportingPoints
              - opposingPoints
              - openQuestions
              properties:
                summary:
                  type: string
                latestSpeaker:
                  type: string
                openQuestions:
                  type: array
                  items:
                    type: string
                opposingPoints:
                  type: array
                  items:
                    type: string
                supportingPoints:
                  type: array
                  items:
                    type: string
        marketReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        outputLanguage:
          type: string
        macroContext:
          type: object
          required: []
          properties: {}
        newsBreadth:
          type: object
          required: []
          properties: {}
        sentimentReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        fundamentalsReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
    outputSchema: investment_debate_transition
    capabilityProfiles: []
    mcpServers: []
  - key: bear_researcher
    name: Bear Researcher
    description: Bearish investment-debate advocate using analyst reports, not direct
      tools.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents bear researcher in a bounded investment debate. Use the provided analyst reports and prior debate state; you do not have direct tools.

      Build the strongest evidence-based bearish case for the ticker over the requested horizon. Highlight downside catalysts, deteriorating signals, valuation or balance-sheet concerns, sentiment/news risks, and why bullish arguments may be fragile. Do not fabricate new evidence beyond the supplied reports.

      Return a debate-stage response in outputLanguage that can update bearCase and debateHistory. Keep the posture analytical and advisory-only; do not issue execution instructions.
    inputSchema:
      type: object
      required: []
      properties:
        newsReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        priorState:
          type: object
          required: []
          properties:
            nextState:
              type: object
              required:
              - latestSpeaker
              - summary
              - supportingPoints
              - opposingPoints
              - openQuestions
              properties:
                summary:
                  type: string
                latestSpeaker:
                  type: string
                openQuestions:
                  type: array
                  items:
                    type: string
                opposingPoints:
                  type: array
                  items:
                    type: string
                supportingPoints:
                  type: array
                  items:
                    type: string
        marketReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        outputLanguage:
          type: string
        sentimentReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        fundamentalsReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
    outputSchema: investment_debate_transition
    capabilityProfiles: []
    mcpServers: []
  - key: research_manager
    name: Research Manager
    description: Structured arbiter of the investment debate and research plan.
    modelConnection: tradingagents_primary_model
    systemPrompt: |-
      You are the TradingAgents research manager translated into SignalDeck package semantics. Review the full analyst packet and bull/bear debate state; you do not have direct tools.

      Weigh the competing evidence, including bounded macroContext, newsBreadth, and predictionMarketContext when provided, identify the decisive uncertainties, and choose a balanced advisory recommendation for the requested horizon. Preserve nuance: a recommendation may be bullish, bearish, neutral, or conditional when evidence is mixed. Treat macro, web breadth, and prediction-market packets as non-authoritative supplementary evidence, and do not introduce facts that are absent from the supplied reports, packets, and debate.

      Return only structured content matching the local research_plan schema: recommendation, thesis, and debateSummary. Keep it advisory-only and do not present live trading instructions.
    inputSchema:
      type: object
      required: []
      properties:
        ticker:
          type: string
        newsReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        debateState:
          type: object
          required: []
          properties:
            nextState:
              type: object
              required:
              - latestSpeaker
              - summary
              - supportingPoints
              - opposingPoints
              - openQuestions
              properties:
                summary:
                  type: string
                latestSpeaker:
                  type: string
                openQuestions:
                  type: array
                  items:
                    type: string
                opposingPoints:
                  type: array
                  items:
                    type: string
                supportingPoints:
                  type: array
                  items:
                    type: string
        horizonDays:
          type: integer
        marketReport:
          type: object
          required:
          - summary
          - evidence
          - limitations
          properties:
            summary:
              type: string
            evidence:
              type: array
              items:
                type: string
            limitations:
              type: array
              items:
                type: string
        analystReports:
          type: object
          required: []
          properties:
            newsReport:
              type: object
              required:
              - summary
              - evidence
              - limitations
              properties:
                summary:
                  type: string
                evidence:
                  type: array
                  items:
                    type: string
                limitations:
                  type: array
                  items:
                    type: string
            marketReport:
              type: object
              required:
              - summary
              - evidence
              - limitations
              properties:
                summary:
                  type: string
                evidence:
                  type: array
                  items:
                    type: string
                limitations:
                  type: array
                  items:
                    type: string
            sentimentReport:
              type: object
              required:
              - summary
              - evidence
              - limitations
              properties:
                summary:
                  type: string
                evidence:
                  type: array
                  items:
                    type: string
                limitations:
                  type: array
                  items:
                    type: string
            fundamentalsReport:
              type: object
              required:
              - summary
              - evidence
              - limitations
              properties:
                summary:
                  type: string
                evidence:
                  type: array
                  items:
                    type: string
                limitations:
                  type: array
                  items:
                    type: string
        outputLanguage:
