apiVersion: signaldeck.workflowPackage/v1
kind: WorkflowPackage
metadata:
  key: tradingagents_advisory_research
  name: TradingAgents Advisory Research
  description: advisory/research workflow that approximates TradingAgents
    through SignalDeck package semantics, not LangGraph runtime parity
spec:
  inputs:
    type: object
    title: TradingAgents advisory research inputs
    required:
      - ticker
      - asOfDate
      - horizonDays
      - benchmarkSymbol
    properties:
      ticker:
        type: string
        title: Ticker symbol
        description: Required equity or asset symbol to research, such as AAPL.
      asOfDate:
        type: string
        title: As-of date
        description: Required research date in YYYY-MM-DD format for
          point-in-time context.
      horizonDays:
        type: integer
        title: Horizon in days
        default: 30
        description: Required advisory horizon, in calendar days, for the
          research and risk framing.
      portfolioId:
        type: string
        title: Portfolio ID
        default: ""
        description: Optional SignalDeck portfolio identifier used to include
          current positions when available. Leave blank for standalone research.
      outputLanguage:
        type: string
        title: Output language
        default: English
        description: Optional language for generated advisory reports.
      benchmarkSymbol:
        type: string
        title: Benchmark symbol
        default: SPY
        description: Required benchmark symbol used for relative market and risk
          context.
      maxRiskDebateRounds:
        type: integer
        title: Risk debate rounds
        default: 2
        description: Optional cap for risk debate iterations; defaults to a
          short, operator-friendly review.
      maxInvestmentDebateRounds:
        type: integer
        title: Investment debate rounds
        default: 2
        description: Optional cap for investment debate iterations; defaults to
          a short, operator-friendly review.
    description: Operator inputs for a neutral advisory research run. Defaults
      are safe placeholders and do not contain credentials or provider
      configuration.
  capabilityProfiles:
    - key: market_research_tools
      name: Market Research Tools
      description: Reads market prices, history, OHLCV, and indicators from
        SignalDeck native tools.
      toolKeys:
        - signaldeck.indicators.lookup
        - signaldeck.market_data.history_lookup
        - signaldeck.market_data.ohlcv_lookup
        - signaldeck.market_data.quote_lookup
    - key: fundamentals_tools
      name: Fundamentals Tools
      description: Reads fundamentals data exposed by the SignalDeck server
        catalog.
      toolKeys:
        - signaldeck.fundamentals.lookup
    - key: news_research_tools
      name: News Research Tools
      description: Reads company news and insider-data context from SignalDeck
        native tools.
      toolKeys:
        - signaldeck.insider_data.lookup
        - signaldeck.news.lookup
    - key: social_sentiment_tools
      name: Social Sentiment Tools
      description: Reads normalized social sentiment source blocks from
        SignalDeck native tools.
      toolKeys:
        - signaldeck.social_sentiment.lookup
    - key: report_context_tools
      name: Report Context Tools
      description: Reads persisted SignalDeck reports for advisory research
        context.
      toolKeys:
        - signaldeck.reports.lookup
    - key: portfolio_context_tools
      name: Portfolio Context Tools
      description: Reads persisted SignalDeck positions for portfolio context.
      toolKeys:
        - signaldeck.positions.lookup
    - key: memory_write_tools
      name: Memory Tools
      description: Reads and writes advisory memory through SignalDeck core
        memory tools.
      toolKeys:
        - signaldeck.memory.lookup
        - signaldeck.memory.write
  outputSchemas:
    - key: analyst_report
      name: Analyst Report
      description: Structured analyst research note.
      jsonSchema:
        type: object
        required:
          - summary
          - evidence
          - limitations
        properties:
          summary:
            type: string
          evidence:
            type: array
            items:
              type: string
          limitations:
            type: array
            items:
              type: string
    - key: investment_debate_transition
      name: Investment Debate Transition
      description: Complete investment debate state transition.
      jsonSchema:
        type: object
        required:
          - nextState
        properties:
          nextState:
            type: object
            required:
              - latestSpeaker
              - summary
              - supportingPoints
              - opposingPoints
              - openQuestions
            properties:
              summary:
                type: string
              latestSpeaker:
                type: string
              openQuestions:
                type: array
                items:
                  type: string
              opposingPoints:
                type: array
                items:
                  type: string
              supportingPoints:
                type: array
                items:
                  type: string
    - key: research_plan
      name: Research Plan
      description: Research manager advisory plan.
      jsonSchema:
        type: object
        required:
          - thesis
          - debateSummary
          - recommendation
        properties:
          thesis:
            type: string
          debateSummary:
            type: string
          recommendation:
            type: string
    - key: trader_proposal
      name: Trader Proposal
      description: Advisory portfolio exposure proposal.
      jsonSchema:
        type: object
        required:
          - posture
          - rationale
          - sizingNotes
        properties:
          posture:
            type: string
          rationale:
            type: string
          sizingNotes:
            type: string
    - key: risk_debate_transition
      name: Risk Debate Transition
      description: Complete risk debate state transition.
      jsonSchema:
        type: object
        required:
          - nextState
        properties:
          nextState:
            type: object
            required:
              - latestSpeaker
              - summary
              - supportingPoints
              - opposingPoints
              - openQuestions
            properties:
              summary:
                type: string
              latestSpeaker:
                type: string
              openQuestions:
                type: array
                items:
                  type: string
              opposingPoints:
                type: array
                items:
                  type: string
              supportingPoints:
                type: array
                items:
                  type: string
    - key: portfolio_decision
      name: Portfolio Decision
      description: Final advisory portfolio decision.
      jsonSchema:
        type: object
        required:
          - posture
          - rationale
          - riskSummary
          - implementationNotes
        properties:
          posture:
            type: string
          rationale:
            type: string
          riskSummary:
            type: string
          implementationNotes:
            type: string
  mcpServers: []
  agents:
    - key: market_analyst
      name: Market Analyst
      description: Tool-first market technician for TradingAgents-style advisory
        research.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents market analyst translated into SignalDeck package semantics. Use only the granted SignalDeck market research tools and the provided run inputs for ticker, asOfDate, horizonDays, benchmarkSymbol, and outputLanguage.

        Gather quote, historical price, OHLCV, and indicator evidence before writing conclusions. Select no more than eight indicators, request them by exact supported indicator names when a tool requires names, and explain why each selected signal matters for the requested horizon. Do not invent prices, indicators, liquidity, or benchmark behavior; if a tool returns warnings, stale data, or empty payloads, disclose that limitation.

        Produce a concise market report in the requested language. Emphasize trend, momentum, volatility, volume, support/resistance, and benchmark-relative context. End with a Markdown table summarizing each tool-backed signal, its reading, and its implication. This is research only, not a recommendation to trade.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
          outputLanguage:
            type: string
          benchmarkSymbol:
            type: string
      outputSchema: analyst_report
      capabilityProfiles:
        - market_research_tools
      mcpServers: []
    - key: sentiment_analyst
      name: Sentiment Analyst
      description: Single-shot sentiment synthesizer using SignalDeck social
        sentiment payloads.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the canonical TradingAgents sentiment analyst, replacing the deprecated social-media analyst role. In SignalDeck, treat social sentiment as pre-normalized source blocks from the granted social sentiment tool and any provided prefetched sentiment context.

        Perform a single-shot synthesis rather than fabricating posts, usernames, engagement counts, or community narratives. Use the granted social sentiment capability only for the requested ticker/date context, then explain directional sentiment, intensity, notable disagreements, and coverage gaps. If source coverage is stale, sparse, unavailable, or warning-bearing, say so plainly.

        Produce an advisory sentiment report in the requested outputLanguage. Keep the report evidence-based and research-only; do not recommend order placement, execution timing, or trade-operation drafting.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
          outputLanguage:
            type: string
          prefetchedSentiment:
            type: object
            required: []
            properties: {}
      outputSchema: analyst_report
      capabilityProfiles:
        - social_sentiment_tools
      mcpServers: []
    - key: news_analyst
      name: News Analyst
      description: Tool-first news and insider-data analyst for the advisory
        research packet.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents news analyst translated into SignalDeck package semantics. Use only the granted SignalDeck news research tools for company news and insider-data context around ticker and asOfDate.

        Ground every catalyst, event, insider signal, and macro or sector reference in returned tool evidence or provided inputs. Do not invent articles, headlines, dates, filings, sources, or insider activity. Disclose missing provider coverage, stale data, empty payloads, and tool warnings as data-quality limitations.

        Produce a concise news report in outputLanguage that separates confirmed catalysts, possible second-order effects, and uncertainties for the requested horizon. Keep the framing advisory and research-only.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
          outputLanguage:
            type: string
      outputSchema: analyst_report
      capabilityProfiles:
        - news_research_tools
      mcpServers: []
    - key: fundamentals_analyst
      name: Fundamentals Analyst
      description: Tool-first fundamentals analyst for valuation, quality, and
        financial context.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents fundamentals analyst translated into SignalDeck package semantics. Use only the granted SignalDeck fundamentals tool and provided run inputs; never invent financial statements, ratios, filing facts, margins, growth rates, or valuation multiples.

        Analyze the returned fundamentals for quality, growth, profitability, leverage, valuation, and horizon-relevant risks. When data is incomplete, stale, warning-bearing, or absent, disclose the limitation and avoid overconfidence.

        Produce a concise fundamentals report in outputLanguage with evidence-backed positives, negatives, and watch items. Keep the framing advisory and research-only.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
          outputLanguage:
            type: string
      outputSchema: analyst_report
      capabilityProfiles:
        - fundamentals_tools
      mcpServers: []
    - key: bull_researcher
      name: Bull Researcher
      description: Bullish investment-debate advocate using analyst reports, not
        direct tools.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents bull researcher in a bounded investment debate. Use the provided market, sentiment, news, and fundamentals reports plus prior debate state; you do not have direct tools.

        Build the strongest evidence-based bullish case for the ticker over the requested horizon. Address upside catalysts, supportive technical or fundamental evidence, sentiment/news tailwinds, and why bearish objections may be overstated. Do not fabricate new evidence beyond the supplied reports.

        Return a debate-stage response in outputLanguage that can update bullCase and debateHistory. Keep the posture analytical and advisory-only; do not issue execution instructions.
      inputSchema:
        type: object
        required: []
        properties:
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          priorState:
            type: object
            required: []
            properties:
              nextState:
                type: object
                required:
                  - latestSpeaker
                  - summary
                  - supportingPoints
                  - opposingPoints
                  - openQuestions
                properties:
                  summary:
                    type: string
                  latestSpeaker:
                    type: string
                  openQuestions:
                    type: array
                    items:
                      type: string
                  opposingPoints:
                    type: array
                    items:
                      type: string
                  supportingPoints:
                    type: array
                    items:
                      type: string
          marketReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          outputLanguage:
            type: string
          sentimentReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          fundamentalsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
      outputSchema: investment_debate_transition
      capabilityProfiles: []
      mcpServers: []
    - key: bear_researcher
      name: Bear Researcher
      description: Bearish investment-debate advocate using analyst reports, not
        direct tools.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents bear researcher in a bounded investment debate. Use the provided analyst reports and prior debate state; you do not have direct tools.

        Build the strongest evidence-based bearish case for the ticker over the requested horizon. Highlight downside catalysts, deteriorating signals, valuation or balance-sheet concerns, sentiment/news risks, and why bullish arguments may be fragile. Do not fabricate new evidence beyond the supplied reports.

        Return a debate-stage response in outputLanguage that can update bearCase and debateHistory. Keep the posture analytical and advisory-only; do not issue execution instructions.
      inputSchema:
        type: object
        required: []
        properties:
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          priorState:
            type: object
            required: []
            properties:
              nextState:
                type: object
                required:
                  - latestSpeaker
                  - summary
                  - supportingPoints
                  - opposingPoints
                  - openQuestions
                properties:
                  summary:
                    type: string
                  latestSpeaker:
                    type: string
                  openQuestions:
                    type: array
                    items:
                      type: string
                  opposingPoints:
                    type: array
                    items:
                      type: string
                  supportingPoints:
                    type: array
                    items:
                      type: string
          marketReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          outputLanguage:
            type: string
          sentimentReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          fundamentalsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
      outputSchema: investment_debate_transition
      capabilityProfiles: []
      mcpServers: []
    - key: research_manager
      name: Research Manager
      description: Structured arbiter of the investment debate and research
        plan.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents research manager translated into SignalDeck package semantics. Review the full analyst packet and bull/bear debate state; you do not have direct tools.

        Weigh the competing evidence, identify the decisive uncertainties, and choose a balanced advisory recommendation for the requested horizon. Preserve nuance: a recommendation may be bullish, bearish, neutral, or conditional when evidence is mixed. Do not introduce facts that are absent from the supplied reports and debate.

        Return only structured content matching the local research_plan schema: recommendation, thesis, and debateSummary. Keep it advisory-only and do not present live trading instructions.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          debateState:
            type: object
            required: []
            properties:
              nextState:
                type: object
                required:
                  - latestSpeaker
                  - summary
                  - supportingPoints
                  - opposingPoints
                  - openQuestions
                properties:
                  summary:
                    type: string
                  latestSpeaker:
                    type: string
                  openQuestions:
                    type: array
                    items:
                      type: string
                  opposingPoints:
                    type: array
                    items:
                      type: string
                  supportingPoints:
                    type: array
                    items:
                      type: string
          horizonDays:
            type: integer
          marketReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          analystReports:
            type: object
            required: []
            properties:
              newsReport:
                type: object
                required:
                  - summary
                  - evidence
                  - limitations
                properties:
                  summary:
                    type: string
                  evidence:
                    type: array
                    items:
                      type: string
                  limitations:
                    type: array
                    items:
                      type: string
              marketReport:
                type: object
                required:
                  - summary
                  - evidence
                  - limitations
                properties:
                  summary:
                    type: string
                  evidence:
                    type: array
                    items:
                      type: string
                  limitations:
                    type: array
                    items:
                      type: string
              sentimentReport:
                type: object
                required:
                  - summary
                  - evidence
                  - limitations
                properties:
                  summary:
                    type: string
                  evidence:
                    type: array
                    items:
                      type: string
                  limitations:
                    type: array
                    items:
                      type: string
              fundamentalsReport:
                type: object
                required:
                  - summary
                  - evidence
                  - limitations
                properties:
                  summary:
                    type: string
                  evidence:
                    type: array
                    items:
                      type: string
                  limitations:
                    type: array
                    items:
                      type: string
          outputLanguage:
            type: string
          sentimentReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          fundamentalsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
      outputSchema: research_plan
      capabilityProfiles: []
      mcpServers: []
    - key: trader
      name: Trader
      description: Structured advisory exposure proposer, with no execution
        authority.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents trader role translated into SignalDeck advisory semantics. Use the research plan, supplied context, and granted SignalDeck portfolio position lookup when portfolioId is present.

        Convert the research plan into an advisory exposure posture for the requested horizon, considering current holdings when available. Disclose missing or unavailable portfolio context. Do not place orders, imply live execution, draft trade operations, create order tickets, or instruct an operator to execute immediately.

        Return only structured content matching the local trader_proposal schema: posture, rationale, and sizingNotes. The sizingNotes field must be educational and risk-aware, not an executable trade instruction.
      inputSchema:
        type: object
        required: []
        properties:
          ticker:
            type: string
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          horizonDays:
            type: integer
          portfolioId:
            type: string
          marketReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          researchPlan:
            type: object
            required:
              - thesis
              - debateSummary
              - recommendation
            properties:
              thesis:
                type: string
              debateSummary:
                type: string
              recommendation:
                type: string
          outputLanguage:
            type: string
          sentimentReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          fundamentalsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
      outputSchema: trader_proposal
      capabilityProfiles:
        - portfolio_context_tools
      mcpServers: []
    - key: aggressive_risk_analyst
      name: Aggressive Risk Analyst
      description: Pro-risk debater focused on opportunity cost and upside
        participation.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents aggressive risk analyst in a bounded risk debate. Use the provided research plan, trader proposal, analyst reports, and prior risk debate state; you do not have direct tools.

        Argue from an opportunity-seeking risk perspective. Stress upside asymmetry, opportunity cost of inaction, and conditions where a larger advisory exposure could be justified. Confront neutral and conservative objections using only supplied evidence.

        Return a debate-stage response in outputLanguage suitable for updating aggressiveCase and debateHistory. Keep it advisory-only and do not provide executable trade instructions.
      inputSchema:
        type: object
        required: []
        properties:
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          priorState:
            type: object
            required: []
            properties:
              nextState:
                type: object
                required:
                  - latestSpeaker
                  - summary
                  - supportingPoints
                  - opposingPoints
                  - openQuestions
                properties:
                  summary:
                    type: string
                  latestSpeaker:
                    type: string
                  openQuestions:
                    type: array
                    items:
                      type: string
                  opposingPoints:
                    type: array
                    items:
                      type: string
                  supportingPoints:
                    type: array
                    items:
                      type: string
          marketReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          researchPlan:
            type: object
            required:
              - thesis
              - debateSummary
              - recommendation
            properties:
              thesis:
                type: string
              debateSummary:
                type: string
              recommendation:
                type: string
          outputLanguage:
            type: string
          traderProposal:
            type: object
            required:
              - posture
              - rationale
              - sizingNotes
            properties:
              posture:
                type: string
              rationale:
                type: string
              sizingNotes:
                type: string
          sentimentReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          fundamentalsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
      outputSchema: risk_debate_transition
      capabilityProfiles: []
      mcpServers: []
    - key: neutral_risk_analyst
      name: Neutral Risk Analyst
      description: Balanced risk debater focused on proportionality and evidence
        quality.
      modelConnection: tradingagents_primary_model
      systemPrompt: |-
        You are the TradingAgents neutral risk analyst in a bounded risk debate. Use the provided research plan, trader proposal, analyst reports, and prior risk debate state; you do not have direct tools.

        Argue from a balanced risk perspective. Test whether the proposed exposure is proportional to evidence quality, uncertainty, horizon, and portfolio context. Identify compromise postures and monitoring conditions when aggressive or conservative views overreach.

        Return a debate-stage response in outputLanguage suitable for updating neutralCase and debateHistory. Keep it advisory-only and do not provide executable trade instructions.
      inputSchema:
        type: object
        required: []
        properties:
          newsReport:
            type: object
            required:
              - summary
              - evidence
              - limitations
            properties:
              summary:
                type: string
              evidence:
                type: array
                items:
                  type: string
              limitations:
                type: array
                items:
                  type: string
          priorState:
