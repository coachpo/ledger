apiVersion: signaldeck.workflowPackage/v1
kind: WorkflowPackage
metadata:
  key: digital_oracle_researcher
  name: Digital Oracle Researcher
  description: Final proven demo package for research-only Digital Oracle finance analysis.
spec:
  inputs:
    type: object
    title: Digital Oracle research inputs
    description: Operator inputs for a research-only Digital Oracle finance run.
    required:
      - researchQuestion
      - outputLanguage
    properties:
      researchQuestion:
        type: string
        title: Research question
        description: Required finance research question to investigate with granted tools.
      outputLanguage:
        type: string
        title: Output language
        default: English
        description: Required language for the final structured report.
      ticker:
        type: string
        title: Ticker
        default: ""
        description: Optional ticker to focus SEC filing context when relevant.
      asOfDate:
        type: string
        title: As-of date
        default: ""
        description: Optional point-in-time date in YYYY-MM-DD format.
      horizonDays:
        type: integer
        title: Horizon days
        default: 30
        description: Optional research horizon in calendar days.
  capabilityProfiles:
    - key: digital_oracle_phase1_tools
      name: Digital Oracle Phase 1 Tools
      description: Grants finance-owned prediction market, SEC filing, and market sentiment lookups.
      toolKeys:
        - signaldeck.prediction_markets.lookup
        - signaldeck.sec_filings.lookup
        - signaldeck.market_sentiment.lookup
  outputSchemas:
    - key: digital_oracle_report
      name: Digital Oracle Report
      description: Structured research-only Digital Oracle report.
      jsonSchema:
        type: object
        required:
          - summary
          - signals
          - contradictions
          - limitations
          - nextQuestions
        properties:
          summary:
            type: string
          signals:
            type: array
            items:
              type: string
          contradictions:
            type: array
            items:
              type: string
          limitations:
            type: array
            items:
              type: string
          nextQuestions:
            type: array
            items:
              type: string
  agents:
    - key: digital_oracle_researcher
      name: Digital Oracle Researcher
      modelConnection: digital_oracle_primary_model
      systemPrompt: |-
        Digital Oracle methodology is package-local for this agent.
        Decompose each research question into the variable, time window, and tradable or observable signals before using tools.
        Call the minimum relevant granted tools. Use prediction markets for event probabilities, SEC filings for issuer facts, and market sentiment for broad risk appetite.
        Compare contradictory signals across sources. Explain when markets, filings, or sentiment point in different directions.
        Disclose warnings, sparse coverage, stale data, unresolved tickers, and any source gaps before drawing conclusions.
        Synthesize a research-only report in the requested output language.
        Never invent prices, filing facts, event probabilities, sentiment readings, source URLs, or unavailable history.
      inputSchema:
        type: object
        required:
          - researchQuestion
          - outputLanguage
        properties:
          researchQuestion:
            type: string
          outputLanguage:
            type: string
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
      outputSchema: digital_oracle_report
      capabilityProfiles:
        - digital_oracle_phase1_tools
  workflows:
    - key: research
      name: Research
      inputSchema:
        type: object
        required:
          - researchQuestion
          - outputLanguage
        properties:
          researchQuestion:
            type: string
          outputLanguage:
            type: string
          ticker:
            type: string
          asOfDate:
            type: string
          horizonDays:
            type: integer
      flow:
        kind: step
        id: digital_oracle_research
        slot: report
        uses: digital_oracle_researcher
        with:
          researchQuestion: ${{ inputs.researchQuestion }}
          outputLanguage: ${{ inputs.outputLanguage }}
          ticker: ${{ inputs.ticker }}
          asOfDate: ${{ inputs.asOfDate }}
          horizonDays: ${{ inputs.horizonDays }}
      output:
        from: ${{ nodes.digital_oracle_research.outputs.report }}
