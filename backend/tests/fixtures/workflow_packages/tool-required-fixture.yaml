apiVersion: signaldeck.workflowPackage/v1
kind: WorkflowPackage
metadata:
  key: tool_required_fixture
  name: Tool Required Fixture
  description: Deterministic fixture for capability-aware package readiness checks.
spec:
  inputs:
    type: object
    title: Tool required fixture inputs
    required:
      - topic
    properties:
      topic:
        type: string
        title: Topic
      outputLanguage:
        type: string
        title: Output language
        default: English
  capabilityProfiles:
    - key: tool_required
      name: Tool Required
      description: Requires native tool calls.
      toolKeys:
        - signaldeck.memory.lookup
  outputSchemas:
    - key: report
      name: Report
      description: Structured report output.
      jsonSchema:
        type: object
        required:
          - summary
        properties:
          summary:
            type: string
          evidence:
            type: array
            items:
              type: string
  mcpServers: []
  agents:
    - key: analyst
      name: Analyst
      description: Tool-dependent analyst.
      modelConnection: compat_fixture_tools_disabled
      systemPrompt: |-
        Use the granted tools before writing conclusions.
        Return concise JSON output only.
      inputSchema:
        type: object
        required: []
        properties:
          topic:
            type: string
          outputLanguage:
            type: string
      outputSchema: report
      capabilityProfiles:
        - tool_required
      mcpServers: []
  workflows:
    - key: main
      name: Main
      description: Minimal tool-required workflow.
      inputSchema:
        type: object
        required:
          - topic
        properties:
          topic:
            type: string
          outputLanguage:
            type: string
      flow:
        kind: sequence
        id: root_sequence
        nodes:
          - kind: step
            id: analyze
            slot: report
            uses: analyst
            with:
              topic: ${{ inputs.topic }}
              outputLanguage: ${{ inputs.outputLanguage }}
      output:
        from: ${{ nodes.analyze.outputs.report }}
