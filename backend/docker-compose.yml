services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signaldeck
      POSTGRES_USER: signaldeck
      POSTGRES_PASSWORD: signaldeck
    ports:
      - "${SIGNALDECK_DB_PORT:-25432}:5432"
    volumes:
      - signaldeck-postgres-data-25432:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldeck -d signaldeck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  signaldeck-postgres-data-25432:
