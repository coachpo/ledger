services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: signaldeck
      POSTGRES_USER: signaldeck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signaldeck}
    volumes:
      - signaldeck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldeck -d signaldeck"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_FRONTEND: ${BUILD_FRONTEND:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://signaldeck:${POSTGRES_PASSWORD:-signaldeck}@db:5432/signaldeck
      AGENT_PLATFORM_ENCRYPTION_KEY: ${AGENT_PLATFORM_ENCRYPTION_KEY:-signaldeck-agent-platform-dev-key}
      PUBLIC_BASE_URL: http://localhost:${APP_PORT:-8080}
      CORS_ALLOWED_ORIGINS: http://localhost:${APP_PORT:-8080},http://127.0.0.1:${APP_PORT:-8080}
      RUN_SCHEDULER: "true"
      BACKEND_PORT: "8000"
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  signaldeck-postgres-data:
